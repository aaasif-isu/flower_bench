[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-bench"
version = "0.1.0"
description = "Modular Federated Learning Benchmarking Framework (FLBench)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]
flower = [
    "flwr[simulation]>=1.18.0",
    "flwr-datasets[vision]>=0.5.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]

[project.scripts]
fl-bench = "fl_bench.run:main"

[tool.setuptools.packages.find]
include = ["fl_bench*"]
