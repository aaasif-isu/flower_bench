[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitfed"
version = "1.0.0"
description = "SplitFed baseline for FlowerBench"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.23.0,<1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "pillow",
    "matplotlib",
    "openpyxl",
    "tqdm"
]

[tool.hatch.build.targets.wheel]
packages = ["splitfed"]

[tool.flwr]
default-federation = "local-simulation"

[tool.flwr.app]
publisher = "aadishah"

[tool.flwr.app.components]
serverapp = "splitfed.server_app:app"
clientapp = "splitfed.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
num-clients = 5
clients-per-round = 5
local-epochs = 1
batch-size = 64
train-fraction = 0.2
method = "SplitFed"
dataset-name = "cifar10"
partition = "niid"
leaf-root = "/lustre/hdd/LAS/jannesar-lab/aadishah/flower_bench/external/leaf/data/femnist"
seed = 0
max-iid-source-clients = 50
csv-path = "results/splitfed_cifar10_resnet10.csv"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 20
options.backend.client-resources.num-cpus = 4
options.backend.client-resources.num-gpus = 0.0

options.backend.init-args.num-cpus = 8
options.backend.init-args.include-dashboard = false
options.backend.init-args.object-store-memory = 4000000000
