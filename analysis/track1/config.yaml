# Track 1 Benchmark Analysis and Visualization Configuration
track: track1
suite_version: track1_core_v1.0
scoring_version: t1us_hierarchical_geomean_v1.0
results_root: results
exclude_legacy_scaffold: true

reference_method: fedavg
primary_utility_metric:
  name: learning_auc_fraction
  units: accuracy_fraction
  higher_is_better: true
  utility_transform:
    type: identity
    min_valid: 0.0
    max_valid: 1.0

aggregation:
  scheme: equal_hierarchical_geomean
  uncertainty_method: matched_seed_bootstrap
  bootstrap_samples: 2000
  bootstrap_seed: 2026
  confidence_level: 0.95
  weights:
    modalities: null   # null = equal weight (1 / |G|) across modalities
    datasets: null     # null = equal weight (1 / |D_g|) across datasets in modality g
    partitions: null   # null = equal weight (1 / |H_d|) across heterogeneous partitions in dataset d

seeds: [42, 43, 44, 45, 46]

discover_additional_methods: true

methods:
  - fedavg
  - fedprox
  - fedavgm
  - fedadam
  - fednova
  - scaffold

method_labels:
  fedavg: "FedAvg"
  fedprox: "FedProx"
  fedavgm: "FedAvgM"
  fedadam: "FedAdam"
  fednova: "FedNova"
  scaffold: "SCAFFOLD"
  fedspeed: "FedSpeed"
  fedlesam: "FedLESAM"
  fedgps: "FedGPS"
  fedwmsam: "FedWMSAM"
  heterofl: "HeteroFL"

modalities:
  image:
    display_name: "Image Classification"
  language:
    display_name: "Character Language Modeling"

datasets:
  cifar10:
    enabled: true
    modality: image
    display_name: "CIFAR-10 (ResNet-18)"
    model: resnet18
    num_clients: 100
    clients_per_round: 10
    rounds: 500
    eval_interval: 1
    iid_baseline_partition: iid
    partitions:
      - iid
      - alpha_1.0
      - alpha_0.3
      - alpha_0.1
    heterogeneous_partitions:
      - alpha_1.0
      - alpha_0.3
      - alpha_0.1
    partition_labels:
      iid: "IID"
      alpha_1.0: "Dirichlet ($\\alpha=1.0$)"
      alpha_0.3: "Dirichlet ($\\alpha=0.3$)"
      alpha_0.1: "Dirichlet ($\\alpha=0.1$)"
    alpha_map:
      iid: null
      alpha_1.0: 1.0
      alpha_0.3: 0.3
      alpha_0.1: 0.1
    utility_transform:
      type: identity
      min_valid: 0.0
      max_valid: 1.0

  femnist:
    enabled: true
    modality: image
    display_name: "LEAF FEMNIST (CNN)"
    model: femnist_cnn
    num_clients: 500
    clients_per_round: 20
    rounds: 1000
    eval_interval: 10
    iid_baseline_partition: null
    partitions:
      - natural
    heterogeneous_partitions:
      - natural
    partition_labels:
      natural: "Natural User Split"
    utility_transform:
      type: identity
      min_valid: 0.0
      max_valid: 1.0

  shakespeare:
    enabled: true
    modality: language
    display_name: "LEAF Shakespeare (LSTM)"
    model: shakespeare_lstm
    num_clients: 100
    clients_per_round: 10
    rounds: 1000
    eval_interval: 10
    iid_baseline_partition: null
    partitions:
      - natural
    heterogeneous_partitions:
      - natural
    partition_labels:
      natural: "Natural User Split"
    utility_transform:
      type: identity
      min_valid: 0.0
      max_valid: 1.0

metrics:
  convergence: true
  heterogeneity: true
  final_utility: true
  stability: true
  learning_curves: true
  relative_utility: true
  dataset_scores: true
  modality_scores: true
  overall_ranking: true

figures:
  enabled: true
  formats: [pdf, png]
  dpi: 300
  error_band: std  # "std" (sample SD across seeds) or "sem"
  plots:
    overall_ranking: true
    modality_scores: true
    dataset_scores: true
    learning_curves: true
    convergence_auc: true
    heterogeneity_hid: true
    final_accuracy: true
    stability: true

output_dirs:
  root: analysis/track1/outputs
  metrics: analysis/track1/outputs/metrics
  tables: analysis/track1/outputs/tables
  figures: analysis/track1/outputs/figures

